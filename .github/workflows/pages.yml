name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Phones and browsers keep old copies of css and js files for a while.
      # Adding this commit's id to every link makes each deploy fetch fresh files.
      - name: Stamp asset links with the commit id
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+)\"#\\1=\"\\2?v=$v\"#g" index.html
          sed -i -E "s#(from |import )'(\./[^'?]+\.js)'#\\1'\\2?v=$v'#g" js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
